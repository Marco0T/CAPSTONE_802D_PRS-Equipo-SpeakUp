<!DOCTYPE html>
<html lang="es">

<head>

    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpeakUp</title>

    <link rel="stylesheet" href="{% static 'usuarios/registro.css' %}">

</head>

<body>

    <header>

        <h2>Ingresar Datos</h2>

    </header>


    <main>

        <section class="presentacion">

            <h1>Registrarse</h1>

            <form class="formulario" method="POST" action="/registro/">

                {% csrf_token %}

                <label for="usuario">Nombre usuario</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>

                <label for="contrasena2">Ingrese nuevamente</label>
                <input type="password" id="contrasena2" name="contrasena2" required>

                <button type="submit" id="registrar">
                    Registrar
                </button>

            </form>

        </section>

    </main>

</body>

</html>
