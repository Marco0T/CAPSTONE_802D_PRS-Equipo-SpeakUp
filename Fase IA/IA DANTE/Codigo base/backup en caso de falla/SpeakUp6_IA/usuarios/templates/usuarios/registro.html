<!DOCTYPE html>
<html lang="es">

<head>

    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpeakUp</title>

    <link rel="stylesheet" href="{% static 'usuarios/tema.css' %}">
    <link rel="stylesheet" href="{% static 'usuarios/registro.css' %}">

    <link rel="stylesheet" href="{% static 'usuarios/ajustes_interfaz.css' %}?v=1">

</head>

<body>

    <header>

        <a class="marca-app" href="/"><b>S</b><span>Speak<i>UP</i></span></a>
        <h2>Ingresar datos</h2>

    </header>


    <main>

        <section class="presentacion">

            <h1>Crea tu cuenta</h1>
            <p class="subtitulo">Empieza a practicar tu comunicación en minutos.</p>

            <form class="formulario" method="POST" action="/registro/">

                {% csrf_token %}

                <label for="usuario">Nombre usuario</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>

                <label for="contrasena2">Ingrese nuevamente</label>
                <input type="password" id="contrasena2" name="contrasena2" required>

                <button type="submit" id="registrar">
                    Registrar
                </button>

            </form>

            <a class="volver" href="/login/">¿Ya tienes cuenta? Inicia sesión</a>

        </section>

    </main>

</body>

</html>
