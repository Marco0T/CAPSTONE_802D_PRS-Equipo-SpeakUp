<!DOCTYPE html>
<html lang="es">

<head>

    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpeakUp</title>

    <link rel="stylesheet" href="{% static 'usuarios/tema.css' %}">
    <link rel="stylesheet" href="{% static 'usuarios/inicias_sesion.css' %}">

    <link rel="stylesheet" href="{% static 'usuarios/ajustes_interfaz.css' %}?v=1">

</head>

<body>

    <header>

        <a class="marca-app" href="/"><b>S</b><span>Speak<i>UP</i></span></a>
        <h2>Ingresar datos</h2>

    </header>


    <main>

        <section class="presentacion">

            <h1>Iniciar sesión</h1>
            <p class="subtitulo">Qué bueno verte de nuevo. Sigue practicando a tu ritmo.</p>

            <form class="formulario" method="POST" action="/login/">

                {% csrf_token %}

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>

                <button type="submit" id="ingresar">
                    Iniciar Sesión
                </button>

            </form>

            <div class="separador">¿Aún no tienes cuenta?</div>

            <button type="button" id="registrar"
                    onclick="window.location.href='/registro/'">
                Registrarse
            </button>

        </section>

    </main>

</body>

</html>
